# ==============================================================================
# Erkab EdTech Platform - Production Docker Compose
# Architecture: Next.js Website + Next.js Admin + Node/Prisma Backend + Nginx
# Optimized for Zergaw Cloud VPS CS02004 (2 vCPU / 4 GB RAM / Ubuntu 24.04 LTS)
# ==============================================================================

name: erkab-platform

services:
  # ----------------------------------------------------------------------------
  # 1. Central Backend API (Node.js + Prisma 8 + Express)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: erkab-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL}
      - SESSION_SECRET=${SESSION_SECRET}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - MAX_FILE_SIZE_BYTES=${MAX_FILE_SIZE_BYTES:-5242880}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-900000}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-300}
      - BREVO_SMTP_SERVER=${BREVO_SMTP_SERVER}
      - BREVO_SMTP_PORT=${BREVO_SMTP_PORT:-587}
      - BREVO_SMTP_LOGIN=${BREVO_SMTP_LOGIN}
      - BREVO_SMTP_KEY=${BREVO_SMTP_KEY}
      - BREVO_SENDER_EMAIL=${BREVO_SENDER_EMAIL}
      - BREVO_SENDER_NAME=${BREVO_SENDER_NAME:-Erkab Skills Training Organization}
    expose:
      - "5000"
    networks:
      - erkab-internal
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ----------------------------------------------------------------------------
  # 2. Public Website (Next.js 16 Standalone)
  # ----------------------------------------------------------------------------
  erkab-website:
    build:
      context: ./erkab-website
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_WEBSITE_API_URL:-https://api.erkab.org}
    container_name: erkab-website
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
    expose:
      - "3000"
    networks:
      - erkab-internal
    deploy:
      resources:
        limits:
          cpus: "0.8"
          memory: 768M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ----------------------------------------------------------------------------
  # 3. Admin Portal (Next.js 16 Standalone)
  # ----------------------------------------------------------------------------
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_ADMIN_API_URL:-https://api.erkab.org/api/v1}
    container_name: erkab-admin
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3002
    expose:
      - "3002"
    networks:
      - erkab-internal
    deploy:
      resources:
        limits:
          cpus: "0.8"
          memory: 768M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ----------------------------------------------------------------------------
  # 4. Reverse Proxy & SSL Termination (Nginx)
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: erkab-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deployment/nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-var:/var/lib/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
      erkab-website:
        condition: service_healthy
      admin:
        condition: service_healthy
    networks:
      - erkab-internal
    deploy:
      resources:
        limits:
          cpus: "0.4"
          memory: 256M
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ----------------------------------------------------------------------------
  # 5. Let's Encrypt Certbot SSL Auto-Renewal Companion
  # ----------------------------------------------------------------------------
  certbot:
    image: certbot/certbot:latest
    container_name: erkab-certbot
    restart: unless-stopped
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'"
    networks:
      - erkab-internal

networks:
  erkab-internal:
    driver: bridge
    name: erkab-internal-net

volumes:
  certbot-etc:
    name: erkab-certbot-etc
  certbot-var:
    name: erkab-certbot-var
  certbot-webroot:
    name: erkab-certbot-webroot
