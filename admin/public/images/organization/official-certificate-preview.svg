<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 565" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFCF9" />
      <stop offset="50%" stop-color="#F7F9FB" />
      <stop offset="100%" stop-color="#F0F4F8" />
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0878B9" />
      <stop offset="50%" stop-color="#13BCEB" />
      <stop offset="100%" stop-color="#075A91" />
    </linearGradient>
    <pattern id="guilloche" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 0 20 Q 10 0 20 20 T 40 20" fill="none" stroke="rgba(8, 120, 185, 0.04)" stroke-width="1.5" />
      <path d="M 20 0 Q 0 10 20 20 T 20 40" fill="none" stroke="rgba(19, 188, 235, 0.04)" stroke-width="1.5" />
    </pattern>
  </defs>

  <!-- Document Canvas -->
  <rect x="0" y="0" width="800" height="565" rx="10" fill="url(#bgGrad)" />
  <rect x="0" y="0" width="800" height="565" rx="10" fill="url(#guilloche)" />

  <!-- Outer Security Border -->
  <rect x="24" y="24" width="752" height="517" rx="6" fill="none" stroke="url(#goldBorder)" stroke-width="3" />
  <rect x="32" y="32" width="736" height="501" rx="4" fill="none" stroke="#D3DBE2" stroke-width="1" stroke-dasharray="4 2" />

  <!-- Corner Rosettes -->
  <circle cx="36" cy="36" r="6" fill="#0878B9" />
  <circle cx="764" cy="36" r="6" fill="#0878B9" />
  <circle cx="36" cy="529" r="6" fill="#0878B9" />
  <circle cx="764" cy="529" r="6" fill="#0878B9" />

  <!-- Central Watermark Emblem -->
  <g opacity="0.06" transform="translate(400, 280)">
    <circle cx="0" cy="0" r="140" fill="none" stroke="#0878B9" stroke-width="6" />
    <circle cx="0" cy="0" r="110" fill="none" stroke="#0878B9" stroke-width="2" stroke-dasharray="6 4" />
    <text x="0" y="20" font-family="Inter, sans-serif" font-size="80" font-weight="900" fill="#0878B9" text-anchor="middle">ERKAB</text>
  </g>

  <!-- Document Header -->
  <g transform="translate(400, 95)" text-anchor="middle">
    <text font-family="Inter, sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#075A91">OFFICIAL INSTITUTIONAL RECOGNITION &amp; IDENTITY</text>
    <line x1="-180" y1="16" x2="180" y2="16" stroke="#0878B9" stroke-width="1.5" />
    <circle cx="0" cy="16" r="3" fill="#13BCEB" />
  </g>

  <!-- Document Category Badge -->
  <g transform="translate(400, 150)">
    <rect x="-140" y="-14" width="280" height="28" rx="14" fill="rgba(8, 120, 185, 0.08)" stroke="#0878B9" stroke-width="1" />
    <text x="0" y="5" font-family="Inter, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#0878B9" text-anchor="middle">VERIFIED DOCUMENTATION RECORD</text>
  </g>

  <!-- Organization Name (Prominent & Clear) -->
  <g transform="translate(400, 220)" text-anchor="middle">
    <text font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#747982">OFFICIALLY ISSUED TO</text>
    <text y="38" font-family="Inter, sans-serif" font-size="28" font-weight="800" fill="#071927" letter-spacing="-0.5">ERKAB SKILLS TRAINING ORGANIZATION</text>
    <text y="68" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#0878B9">Gondar, Amhara Region, Ethiopia</text>
  </g>

  <!-- Descriptive Statement -->
  <g transform="translate(400, 335)" text-anchor="middle">
    <text font-family="Inter, sans-serif" font-size="13" fill="#4B5563" line-height="1.6">
      <tspan x="0" dy="0">This document verifies that Erkab Skills Training Organization operates as</tspan>
      <tspan x="0" dy="22">a recognized vocational skills training and educational development institution,</tspan>
      <tspan x="0" dy="22">empowering youth through technical, digital, and practical education.</tspan>
    </text>
  </g>

  <!-- Official Seal & Authorization Footer -->
    <g transform="translate(124, 424)">
    <circle cx="36" cy="36" r="38" fill="#ffffff" stroke="#0878B9" stroke-width="2" />
    <clipPath id="sealClip"><circle cx="36" cy="36" r="35" /></clipPath>
    <image href="data:image/jpeg;base64," x="0" y="0" width="72" height="72" clip-path="url(#sealClip)" />
  </g>

  <g transform="translate(400, 470)" text-anchor="middle">
    <line x1="-100" y1="0" x2="100" y2="0" stroke="#94A3B8" stroke-width="1.5" />
    <text y="16" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#64748B">Institutional Governance &amp; Directorate</text>
    <text y="28" font-family="Inter, sans-serif" font-size="9" fill="#94A3B8">Gondar Administrative Office</text>
  </g>

  <g transform="translate(640, 460)">
    <circle cx="0" cy="0" r="36" fill="rgba(199, 255, 69, 0.15)" stroke="#0878B9" stroke-width="2" />
    <text x="0" y="-3" font-family="Inter, sans-serif" font-size="10" font-weight="800" fill="#075A91" text-anchor="middle">STATUS</text>
    <text x="0" y="12" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#0878B9" text-anchor="middle">VERIFIED</text>
  </g>

  <!-- Watermark / Replacement note for developer -->
  <text x="400" y="525" font-family="Inter, sans-serif" font-size="9" fill="#94A3B8" text-anchor="middle">
    Official institutional record • Physical copy on file at Erkab Headquarters
  </text>
</svg>
